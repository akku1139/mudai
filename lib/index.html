<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Declarative Video Engine</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; overflow: hidden; margin: 0; padding: 20px; }
    canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); transform-origin: top left; }
    #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; width: 600px; border: 1px solid #333; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    button { padding: 8px 16px; cursor: pointer; font-weight: bold; background: #444; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #555; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type=range] { flex-grow: 1; margin: 0 10px; }
    #statsPanel { color: #0f0; font-size: 0.9em; }
    #progressText { color: #0ff; font-weight: bold; width: 50px; text-align: right; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="controls">
    <div class="row">
      <div id="statsPanel">Loading...</div>
      <div id="progressText"></div>
    </div>
    <div class="row">
      <button id="btnPlay">Play</button>
      <button id="btnReset">Reset</button>
      <input type="range" id="seekBar" min="0" max="100" value="0">
      <button id="btnRender">Render</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
